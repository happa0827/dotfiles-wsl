bind-key r { source-file ~/.tmux.conf ; display-message "Config reloaded!" }


unbind C-b
set -g prefix C-d
bind C-d send-prefix

bind-key -n M-Up resize-pane -U 3
bind-key -n M-Down resize-pane -D 3
bind-key -n M-Left resize-pane -L 3
bind-key -n M-Right resize-pane -R 3

# 垂直分割（上下）- デフォルトの " キー

bind '"' split-window -c "#{pane_current_path}"



# 水平分割（左右）- デフォルトの % キー

bind % split-window -h -c "#{pane_current_path}"

setw -g monitor-activity off
set -g visual-activity off

set-option -g mouse on

# tmuxから端末へクリップボードを送る
set -s set-clipboard on

# viキーバインド
setw -g mode-keys vi

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel


run '~/.tmux/plugins/tpm/tpm'
set -g @plugin 'xamut/tmux-weather'
# resurrect + continuum

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 自動保存間隔（分）

set -g @continuum-save-interval '15'

# tmux 起動時に自動復元

set -g @continuum-restore 'on'

# 保存先（任意）
 set -g @resurrect-dir '~/.tmux/resurrect'

set -g @tmux-weather-location "Tokyo"
set -g status-interval 5
set -g status-right-length 80
set -g status-right "#{continuum_status} #{weather} 🦊%Y/%m/%d %H:%M"

run '~/.tmux/plugins/tpm/tpm'
